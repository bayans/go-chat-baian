apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      containers:
      - name: go-app
        image: ghcr.io/bayans/go-chat-baian:${GITHUB_SHA}
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
