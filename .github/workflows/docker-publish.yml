name: Deploy to Kubernetes

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Decode and Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v2
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Test Kubernetes Connection
        run: |
          kubectl get nodes --kubeconfig=$PWD/kubeconfig

      - name: Apply Deployment
        run: |
          kubectl apply -f k8s/deployment.yaml --kubeconfig=$PWD/kubeconfig

      - name: Apply Kubernetes Service (Manual Command)
        run: |
          kubectl apply -f k8s/service.yaml --kubeconfig=$PWD/kubeconfig --validate=false
